name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # -x follows `source`, -P finds _lib.sh from any script's directory.
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(find scripts -type f)
          shellcheck -x -P scripts -s bash "${files[@]}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run tests
        run: bats tests/*.bats
